name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk JudgeLamp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JudgeLamp-apk
          path: JudgeLamp.apk

      # Also put the APK on the Releases page, where it can be downloaded
      # directly from a phone browser.
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest JudgeLamp.apk --title "JudgeLamp (latest build)" --notes "Built from ${GITHUB_SHA}"
